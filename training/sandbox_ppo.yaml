# The sandbox (docs/action-agents.md): what tools/sandbox_round.py makes a trainer config from. Not a config by itself:
# every species of the round gets a behaviour Action_<id> from `action` and, unless the round is of puppets, a
# behaviour Animal_<id> from `walker` (with its demonstrations and the checkpoint it starts from).

# The mind: a decision every sixth window (5 a second), 39 observations and a buffer of the 16 nearest others,
# 4 continuous actions and the mode. A life lasts minutes: a long horizon. A world gives a few tens of decisions a
# second: a small buffer, so that the policy is updated every few thousand of them (with 20480 the first puppet round
# made 24 updates in 500k decisions and its entropy hardly moved)
action:
    trainer_type: ppo
    hyperparameters:
        batch_size: 512
        buffer_size: 5120
        learning_rate: 3.0e-4
        beta: 5.0e-3
        epsilon: 0.2
        lambd: 0.95
        num_epoch: 3
        learning_rate_schedule: constant
    network_settings:
        normalize: true
        hidden_units: 256
        num_layers: 2
    reward_signals:
        extrinsic:
            strength: 1
            gamma: 0.995
    time_horizon: 128
    summary_freq: 20000
    checkpoint_interval: 500000
    keep_checkpoints: 10
    threaded: false

# The walker: training/animal_orders_ppo.yaml's, learning more slowly (it starts from what it learned alone, and the
# commands it gets now come from a mind that is learning too), GAIL weaker still
walker:
    trainer_type: ppo
    hyperparameters:
        batch_size: 5000
        buffer_size: 50000
        learning_rate: 1.0e-4
        beta: 4.0e-5
        epsilon: 0.2
        num_epoch: 2
        learning_rate_schedule: constant
    network_settings:
        deterministic: false
        normalize: true
        hidden_units: 512
        num_layers: 3
    reward_signals:
        extrinsic:
            strength: 1
            gamma: 0.95
        gail:
            strength: 0.2
            gamma: 0.95
            learning_rate: 1.0e-5
            use_actions: false
            use_vail: false
            demo_path: Demonstrations
            expected_nogail: [nogail_order]
    time_horizon: 200
    summary_freq: 100000
    checkpoint_interval: 2000000
    keep_checkpoints: 10
    threaded: false

# Environment parameters of the round, unless the command line gives others
environment_parameters:
    lifeScale: 1.0
    walkerShare: 0.1
    rewardScale: 1.0
