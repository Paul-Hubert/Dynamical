# A physical animal of the library on TrainingEnv.exe (docs/physical-agents/reports/animal-agents.md): the walker's
# trainer, hyperparameters and reward signals (training/walker_ppo.yaml), for any species. The behaviour is named
# after the species (Animal_<id>): default_settings applies to it. Launched by tools/train_animal.py, which sets
# demo_path and, when asked, max_steps.
default_settings:
    trainer_type: ppo
    hyperparameters:
        batch_size: 5000
        buffer_size: 50000
        learning_rate: 3.0e-4
        beta: 4.0e-5
        epsilon: 0.2
        num_epoch: 2
    network_settings:
        deterministic: false
        normalize: true
        hidden_units: 512
        num_layers: 3
    reward_signals:
        extrinsic:
            strength: 1
            gamma: 0.95
        gail:
            strength: 1
            gamma: 0.95
            learning_rate: 1.0e-5
            use_actions: false
            use_vail: false
            demo_path: Demonstrations
    threaded: false
    max_steps: 20000000
    checkpoint_interval: 5000000
    keep_checkpoints: 10
    time_horizon: 200
    summary_freq: 100000

env_settings:
    seed: 42
