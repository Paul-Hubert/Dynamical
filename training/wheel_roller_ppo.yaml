# PPO for wheel_roll (docs/physical-agents/sphere-roller.md, "Wheel"): the sphere roller task on a sphere of the walker's
# hip height as radius (0.94 m, 69 kg, mu 4, 520 N m). 16 observations in the goal frame, 3 continuous
# actions (a torque), 15 decisions/s, episodes of 600 decisions (40 s) ended by truncation.
# Launch with tools/train_sphere.py --scene wheel_roll, which sets max_steps (and init_path with --init-path) and passes
# scene=wheel_roll mode=train.
behaviors:
  WheelRoller:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 40960
      learning_rate: 3.0e-4
      beta: 2.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 1000000
    time_horizon: 256
    summary_freq: 50000
    checkpoint_interval: 5000000
    keep_checkpoints: 50
