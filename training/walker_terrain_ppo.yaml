# The walker on the marching cubes terrain (docs/physical-agents/reports/terrain-walker.md): training/walker_ppo.yaml
# with 80M steps and a checkpoint every 10M, nothing else changed. Launched by
#   tools/train_walker.py dynamical --scene walker_terrain_train --demo-source gait --demo-scene walker_demo_terrain --demo-decisions 30000
default_settings:
    trainer_type: ppo
    hyperparameters:
        batch_size: 5000
        buffer_size: 50000
        learning_rate: 3.0e-4
        beta: 4.0e-5
        epsilon: 0.2
        num_epoch: 2
    network_settings:
        deterministic: false
        normalize: true
        hidden_units: 512
        num_layers: 3
    reward_signals:
        extrinsic:
            strength: 1
            gamma: 0.95
        gail:
            strength: 1
            gamma: 0.95
            learning_rate: 1.0e-5
            use_actions: false
            use_vail: false
            demo_path: Demonstrations
    threaded: false
    max_steps: 80000000
    checkpoint_interval: 10000000
    keep_checkpoints: 10
    time_horizon: 200
    summary_freq: 100000

environment_parameters:
    energyPenalty: 0.0
    randomSpeed: 0
    targetSpeed: 1.36

env_settings:
    seed: 42
