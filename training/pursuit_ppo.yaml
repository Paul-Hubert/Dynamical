# PPO for pursuit (docs/action-agents.md, several agents in a world): two behaviours trained in one run against the
# same worlds. Each: 6 observations and a buffer of the 8 nearest others (6 values a row, attention in the trainer),
# 2 continuous actions (speed, turn) and a discrete branch (walk, sprint). Chasers decide 10 times a second, runners 5.
# Launch with tools/train_sphere.py --scene pursuit, which sets max_steps and passes scene=pursuit mode=train.
behaviors:
  Chaser:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 1000000
    time_horizon: 64
    summary_freq: 20000
    checkpoint_interval: 500000
    keep_checkpoints: 10
  Runner:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 1000000
    time_horizon: 64
    summary_freq: 20000
    checkpoint_interval: 500000
    keep_checkpoints: 10
