# The Unity reference of the walker port: default-training.yaml with the commanded speed fixed at 1.36 m/s
# (the scene's randomSpeed draws from {0, 1.36}). Launched by tools/train_walker.py unity, which fills demo_path.
default_settings:
    trainer_type: ppo
    hyperparameters:
        batch_size: 5000
        buffer_size: 50000
        learning_rate: 3.0e-4
        beta: 4.0e-5
        epsilon: 0.2
        num_epoch: 2
    network_settings:
        deterministic: false
        normalize: true
        hidden_units: 512
        num_layers: 3
    reward_signals:
        extrinsic:
            strength: 1
            gamma: 0.95
        gail:
            strength: 1
            gamma: 0.95
            learning_rate: 1.0e-5
            use_actions: false
            use_vail: false
            demo_path: Demonstrations
    threaded: false
    max_steps: 40000000
    checkpoint_interval: 5000000
    keep_checkpoints: 10
    time_horizon: 200
    summary_freq: 100000

environment_parameters:
    energyPenalty: 0.0
    randomSpeed: 0
    targetSpeed: 1.36

env_settings:
    seed: 42
