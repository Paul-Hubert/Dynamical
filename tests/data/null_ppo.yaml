# Tiny PPO run against TrainingEnv.exe mode=null (P3: train_smoke.py, bench_null.py).
# The null environment sends 25 agents with a zero 276-float observation and expects 120 continuous actions.
behaviors:
  HeidelBotBehavior:
    trainer_type: ppo
    hyperparameters:
      batch_size: 512
      buffer_size: 5120
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 1
      learning_rate_schedule: linear
    network_settings:
      normalize: false
      hidden_units: 64
      num_layers: 1
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 2000
    time_horizon: 64
    summary_freq: 500
